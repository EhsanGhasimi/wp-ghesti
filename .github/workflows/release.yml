name: Publish plugin release
on:
  push:
    branches: [main]
    paths:
      - 'wp-snapppay/**'
      - 'scripts/build.ps1'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: plugin-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify installable ZIP
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Publish new plugin version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content wp-snapppay/wp-snapppay.php -Raw
          if ($source -notmatch '(?m)^\s*\* Version:\s*(\d+\.\d+\.\d+)\s*$') { throw 'Missing plugin version' }
          $version = $matches[1]
          $tag = "v$version"
          $existing = gh release view $tag --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $names = ($existing | ConvertFrom-Json).assets.name
            foreach ($file in @('wp-ghesti.zip', 'SHA256SUMS.txt')) {
              if ($file -notin $names) {
                gh release upload $tag "dist/$file"
                if ($LASTEXITCODE -ne 0) { throw "Asset upload failed: $file" }
              }
            }
            Write-Output "Release $tag has both installable assets. Increase the plugin version for a new release."
            exit 0
          }
          gh release create $tag dist/wp-ghesti.zip dist/SHA256SUMS.txt --target $env:RELEASE_COMMIT --title "wp-ghesti $version" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }